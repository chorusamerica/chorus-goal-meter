<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chorus America — Campaign Goal</title>
  <style>
    body { margin: 0; padding: 40px; background: #fff; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
    #status { margin-top: 16px; font-size: 13px; color: #888; }
  </style>
</head>
<body>

  <script src='https://chorusamerica.app.neoncrm.com/campaigns/goal-meter/share/Q0FNUEFJR05TSEFSSU5HLUdPQUwtTUVURVIzNTk='></script>

  <div id="status">Refreshing in <span id="countdown">15</span>s</div>

  <script>
    var REFRESH_SECONDS = 15;
    var countdown = document.getElementById('countdown');
    var secondsLeft = REFRESH_SECONDS;
    setInterval(function () {
      secondsLeft--;
      countdown.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        location.reload();
      }
    }, 1000);
  </script>

</body>
</html>
