<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chorus America — Homecoming 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #1d457b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      width: 100%;
      max-width: 780px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }

    .hero-img { width: 100%; display: block; max-height: 260px; object-fit: cover; object-position: center top; }

    .card-body { padding: 2rem 2.75rem; }

    .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }

    .org-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #1d457b; margin-bottom: 0.35rem; }

    .campaign-name { font-family: 'Jost', sans-serif; font-size: 38px; color: #111; line-height: 1.1; }

    .donate-link { text-align: right; flex-shrink: 0; margin-left: 2rem; margin-top: 0.25rem; }
    .donate-link-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 4px; }
    .donate-link-url { font-size: 20px; font-weight: 700; color: #1d457b; text-decoration: none; }
    .donate-link-url:hover { text-decoration: underline; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #f0f4fa; border-radius: 12px; padding: 1rem 1.25rem; }
    .stat-label { font-size: 11px; font-weight: 600; color: #1d457b; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-value { font-size: 32px; font-weight: 700; color: #111; line-height: 1; }
    .stat-value.highlight { color: #1d457b; }

    .bar-wrap { background: #e8eef7; border-radius: 999px; height: 24px; overflow: hidden; margin-bottom: 0.4rem; }
    .bar-fill { height: 100%; border-radius: 999px; background: #1d457b; transition: width 1s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; min-width: 4px; }
    .bar-pct { font-size: 12px; font-weight: 700; color: #fff; }
    .bar-labels { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 1.5rem; }

    .donors-section { margin-bottom: 1.25rem; }
    .donors-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1d457b; margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 2px solid #e8eef7; }
    .donors-list { display: flex; flex-direction: column; gap: 7px; }

    .donor-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 15px; background: #f0f4fa; border-radius: 10px;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .donor-name { font-size: 16px; font-weight: 500; color: #111; }
    .donor-amount { font-size: 15px; font-weight: 700; color: #1d457b; }
    .no-donors { font-size: 14px; color: #aaa; padding: 0.4rem 0; }

    .bottom-img { width: 100%; display: block; max-height: 90px; object-fit: cover; object-position: center; }

    .footer { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 2.75rem; font-size: 12px; color: #888; border-top: 1px solid #e8eef7; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #1d457b; display: inline-block; margin-right: 7px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.65)} }
    .error-msg { color: #A32D2D; font-size: 12px; padding: 0.6rem 0.9rem; background: #FCEBEB; border-radius: 8px; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">

    <img class="hero-img" src="NeonHero.jpg" alt="Homecoming 2026" />

    <div class="card-body">
      <div class="header">
        <div>
          <p class="org-label">Chorus America</p>
          <h1 class="campaign-name" id="camp-name">Homecoming 2026</h1>
        </div>
        <div class="donate-link">
          <p class="donate-link-label">Give now</p>
          <a class="donate-link-url" href="https://bit.ly/hocogift" target="_blank">bit.ly/hocogift</a>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><p class="stat-label">Raised</p><p class="stat-value highlight" id="raised">—</p></div>
        <div class="stat-card"><p class="stat-label">Goal</p><p class="stat-value" id="goal">—</p></div>
        <div class="stat-card"><p class="stat-label">Donations</p><p class="stat-value" id="count">—</p></div>
      </div>

      <div class="bar-wrap"><div class="bar-fill" id="bar" style="width:0%"><span class="bar-pct" id="bar-pct"></span></div></div>
      <div class="bar-labels"><span>$0</span><span id="goal-label">—</span></div>

      <div class="donors-section">
        <p class="donors-title">Most Recent Donors</p>
        <div class="donors-list" id="donors-list"><p class="no-donors">Loading donors...</p></div>
      </div>

      <div id="error-box" style="display:none"></div>
    </div>

    <div class="footer">
      <span><span class="pulse"></span><span id="status">Connecting...</span></span>
      <span style="color:#1d457b; font-weight:600;">chorusamerica.org</span>
    </div>

  </div>

  <script>
    var ORG = 'chorusamerica';
    var API_KEY = '1f2ce8be38aa05ce83db78d374416892';
    var CAMPAIGN_ID = 359;
    var CAMPAIGN_NAME = 'Homecoming 2026';
    var REFRESH_SECONDS = 15;
    var MAX_DONORS = 5;
    var PROXY = 'https://corsproxy.io/?';
    var BASE = 'https://api.neoncrm.com/neonws/services/api/';
    var sessionId = null;
    var secondsLeft = REFRESH_SECONDS;

    function $(id){ return document.getElementById(id); }
    function fmt(n){ return '$' + Math.round(n).toLocaleString(); }
    function setStatus(msg){ $('status').textContent = msg; }
    function setError(msg){ $('error-box').style.display='block'; $('error-box').className='error-msg'; $('error-box').textContent=msg; }

    function updateMeter(data){
      var c = data.retrieveCampaignSummary && data.retrieveCampaignSummary.campaign;
      if(!c){ setError('Unexpected API response.'); return; }
      $('camp-name').textContent = c.name || 'Campaign';
      var raised = parseFloat(c.donationAmount) || 0;
      var goal = parseFloat(c.goal) || 0;
      var count = parseInt(c.donationCount) || 0;
      $('raised').textContent = fmt(raised);
      $('goal').textContent = fmt(goal);
      $('count').textContent = count;
      $('goal-label').textContent = fmt(goal);
      var pct = goal > 0 ? Math.min(100, Math.round((raised/goal)*100)) : 0;
      $('bar').style.width = pct + '%';
      $('bar-pct').textContent = pct > 8 ? pct + '%' : '';
      $('error-box').style.display = 'none';
    }

    function updateDonors(data){
      var list = $('donors-list');
      var results = data.listDonations && data.listDonations.searchResults;
      if(!results){ list.innerHTML = '<p class="no-donors">No donors yet — be the first!</p>'; return; }
      var pairs = results.nameValuePairs;
      if(!Array.isArray(pairs)) pairs = [pairs];
      var donors = [];
      pairs.forEach(function(item){
        var nvp = item.nameValuePair;
        if(!Array.isArray(nvp)) nvp = [nvp];
        var row = {};
        nvp.forEach(function(p){ row[p.name] = p.value; });
        if(row['Full Name (F)'] && row['Campaign Name'] === CAMPAIGN_NAME) donors.push(row);
      });
      if(donors.length === 0){ list.innerHTML = '<p class="no-donors">No donors yet — be the first!</p>'; return; }
      // Reverse so most recent is first, then cap at MAX_DONORS
      donors.reverse();
      donors = donors.slice(0, MAX_DONORS);
      list.innerHTML = donors.map(function(d){
        var name = d['Full Name (F)'] || 'Anonymous';
        var amt = d['Donation Amount'] ? fmt(parseFloat(d['Donation Amount'])) : '';
        return '<div class="donor-row"><span class="donor-name">' + name + '</span><span class="donor-amount">' + amt + '</span></div>';
      }).join('');
    }

    function fetchDonors(){
      var url = PROXY + encodeURIComponent(BASE + 'donation/listDonations?responseType=json&userSessionId=' + sessionId +
        '&outputfields.idnamepair.id=&outputfields.idnamepair.name=Full%20Name%20(F)' +
        '&outputfields.idnamepair.id=&outputfields.idnamepair.name=Donation%20Amount' +
        '&outputfields.idnamepair.id=&outputfields.idnamepair.name=Campaign%20Name' +
        '&searches.search.key=Donation%20Date&searches.search.searchOperator=GREATER_AND_EQUAL&searches.search.value=2026-06-01' +
        '&page.pageSize=100&page.currentPage=1');
      fetch(url).then(function(r){ return r.json(); }).then(function(d){ updateDonors(d); }).catch(function(){});
    }

    function fetchData(){
      if(!sessionId){ login(); return; }
      var url = PROXY + encodeURIComponent(BASE + 'donation/retrieveCampaignSummary?userSessionId=' + sessionId + '&campaignId=' + CAMPAIGN_ID + '&output=json');
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var result = d.retrieveCampaignSummary && d.retrieveCampaignSummary.operationResult;
          if(result === 'SUCCESS'){ updateMeter(d); fetchDonors(); setStatus('Updated just now'); }
          else { sessionId = null; login(); }
        })
        .catch(function(e){ setError('Fetch error: ' + e.message); });
    }

    function login(){
      setStatus('Connecting...');
      var url = PROXY + encodeURIComponent(BASE + 'common/login?login.apiKey=' + API_KEY + '&login.orgid=' + ORG + '&output=json');
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var l = d.loginResponse;
          if(l && l.operationResult === 'SUCCESS'){ sessionId = l.userSessionId; fetchData(); }
          else { setError('Login failed.'); }
        })
        .catch(function(e){ setError('Login error: ' + e.message); });
    }

    setInterval(function(){
      secondsLeft--;
      if(secondsLeft <= 0){ secondsLeft = REFRESH_SECONDS; setStatus('Refreshing...'); fetchData(); }
      else {
        var s = $('status').textContent;
        if(s !== 'Connecting...' && s !== 'Refreshing...') setStatus('Next update in ' + secondsLeft + 's');
      }
    }, 1000);

    login();
  </script>
</body>
</html>
