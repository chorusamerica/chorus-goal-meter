<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chorus America — Campaign Goal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .wrap { width: 100%; max-width: 600px; }
    .org-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 0.4rem; }
    .campaign-name { font-size: 28px; font-weight: 600; color: #111; margin-bottom: 1.5rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #f5f5f3; border-radius: 10px; padding: 1rem; }
    .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 600; color: #111; }
    .stat-value.highlight { color: #0F6E56; }
    .bar-wrap { background: #f5f5f3; border-radius: 999px; height: 24px; overflow: hidden; margin-bottom: 0.5rem; }
    .bar-fill { height: 100%; border-radius: 999px; background: #1D9E75; transition: width 1s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; min-width: 2px; }
    .bar-pct { font-size: 12px; font-weight: 600; color: #fff; }
    .bar-labels { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .donors-section { margin-bottom: 1.5rem; }
    .donors-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin-bottom: 0.75rem; }
    .donors-list { display: flex; flex-direction: column; gap: 8px; }
    .donor-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f5f5f3; border-radius: 8px; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .donor-name { font-size: 15px; font-weight: 500; color: #111; }
    .donor-amount { font-size: 14px; font-weight: 600; color: #0F6E56; }
    .no-donors { font-size: 14px; color: #aaa; padding: 0.5rem 0; }
    .footer { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #888; border-top: 1px solid #eee; padding-top: 1rem; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; display: inline-block; margin-right: 6px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
    .error-msg { color: #A32D2D; font-size: 13px; padding: 0.75rem 1rem; background: #FCEBEB; border-radius: 8px; margin-bottom: 1rem; }
    .donate-btn { background: #1D9E75; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .donate-btn:hover { background: #0F6E56; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="org-label">Chorus America</p>
    <p class="campaign-name" id="camp-name">Loading campaign...</p>
    <div class="stats-grid">
      <div class="stat-card"><p class="stat-label">Raised</p><p class="stat-value highlight" id="raised">—</p></div>
      <div class="stat-card"><p class="stat-label">Goal</p><p class="stat-value" id="goal">—</p></div>
      <div class="stat-card"><p class="stat-label">Donations</p><p class="stat-value" id="count">—</p></div>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="bar" style="width:0%"><span class="bar-pct" id="bar-pct"></span></div></div>
    <div class="bar-labels"><span>$0</span><span id="goal-label">—</span></div>
    <div class="donors-section">
      <p class="donors-title">Our Donors</p>
      <div class="donors-list" id="donors-list"><p class="no-donors">Loading donors...</p></div>
    </div>
    <div id="error-box" style="display:none"></div>
    <div class="footer">
      <span><span class="pulse"></span><span id="status">Connecting...</span></span>
      <a class="donate-btn" href="https://chorusamerica.app.neoncrm.com/np/clients/chorusamerica/donation.jsp?campaign=359" target="_blank">Donate now</a>
    </div>
  </div>

  <script>
    var ORG = 'chorusamerica';
    var API_KEY = '1f2ce8be38aa05ce83db78d374416892';
    var CAMPAIGN_ID = 359;
    var CAMPAIGN_NAME = 'Homecoming 2026';
    var REFRESH_SECONDS = 15;
    var PROXY = 'https://corsproxy.io/?';
    var BASE = 'https://api.neoncrm.com/neonws/services/api/';
    var sessionId = null;
    var secondsLeft = REFRESH_SECONDS;

    function $(id){ return document.getElementById(id); }
    function fmt(n){ return '$' + Math.round(n).toLocaleString(); }
    function setStatus(msg){ $('status').textContent = msg; }
    function setError(msg){ $('error-box').style.display='block'; $('error-box').className='error-msg'; $('error-box').textContent=msg; }

    function updateMeter(data){
      var c = data.retrieveCampaignSummary && data.retrieveCampaignSummary.campaign;
      if(!c){ setError('Unexpected API response.'); return; }
      $('camp-name').textContent = c.name || 'Campaign';
      var raised = parseFloat(c.donationAmount) || 0;
      var goal = parseFloat(c.goal) || 0;
      var count = parseInt(c.donationCount) || 0;
      $('raised').textContent = fmt(raised);
      $('goal').textContent = fmt(goal);
      $('count').textContent = count;
      $('goal-label').textContent = fmt(goal);
      var pct = goal > 0 ? Math.min(100, Math.round((raised/goal)*100)) : 0;
      $('bar').style.width = pct + '%';
      $('bar-pct').textContent = pct > 8 ? pct + '%' : '';
      $('error-box').style.display = 'none';
    }

    function updateDonors(data){
      var list = $('donors-list');
      var results = data.listDonations && data.listDonations.searchResults;
      if(!results){ list.innerHTML = '<p class="no-donors">No donors yet — be the first!</p>'; return; }
      var pairs = results.nameValuePairs;
      if(!Array.isArray(pairs)) pairs = [pairs];
      var donors = [];
      pairs.forEach(function(item){
        var nvp = item.nameValuePair;
        if(!Array.isArray(nvp)) nvp = [nvp];
        var row = {};
        nvp.forEach(function(p){ row[p.name] = p.value; });
        // Filter to only Homecoming 2026 donations
        if(row['Full Name (F)'] && row['Campaign Name'] === CAMPAIGN_NAME){
          donors.push(row);
        }
      });
      if(donors.length === 0){ list.innerHTML = '<p class="no-donors">No donors yet — be the first!</p>'; return; }
      list.innerHTML = donors.map(function(d){
        var name = d['Full Name (F)'] || 'Anonymous';
        var amt = d['Donation Amount'] ? fmt(parseFloat(d['Donation Amount'])) : '';
        return '<div class="donor-row"><span class="donor-name">' + name + '</span><span class="donor-amount">' + amt + '</span></div>';
      }).join('');
    }

    function fetchDonors(){
      // Fetch recent donations (from campaign start date) and filter client-side
      var url = PROXY + encodeURIComponent(BASE + 'donation/listDonations?responseType=json&userSessionId=' + sessionId +
        '&outputfields.idnamepair.id=&outputfields.idnamepair.name=Full%20Name%20(F)' +
        '&outputfields.idnamepair.id=&outputfields.idnamepair.name=Donation%20Amount' +
        '&outputfields.idnamepair.id=&outputfields.idnamepair.name=Campaign%20Name' +
        '&searches.search.key=Donation%20Date&searches.search.searchOperator=GREATER_AND_EQUAL&searches.search.value=2025-09-01' +
        '&page.pageSize=100&page.currentPage=1');
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){ updateDonors(d); })
        .catch(function(e){ console.log('Donor fetch error:', e); });
    }

    function fetchData(){
      if(!sessionId){ login(); return; }
      var url = PROXY + encodeURIComponent(BASE + 'donation/retrieveCampaignSummary?userSessionId=' + sessionId + '&campaignId=' + CAMPAIGN_ID + '&output=json');
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var result = d.retrieveCampaignSummary && d.retrieveCampaignSummary.operationResult;
          if(result === 'SUCCESS'){
            updateMeter(d);
            fetchDonors();
            setStatus('Updated just now');
          } else {
            sessionId = null;
            login();
          }
        })
        .catch(function(e){ setError('Fetch error: ' + e.message); });
    }

    function login(){
      setStatus('Connecting...');
      var url = PROXY + encodeURIComponent(BASE + 'common/login?login.apiKey=' + API_KEY + '&login.orgid=' + ORG + '&output=json');
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var login = d.loginResponse;
          if(login && login.operationResult === 'SUCCESS'){
            sessionId = login.userSessionId;
            fetchData();
          } else {
            setError('Login failed: ' + JSON.stringify(d));
          }
        })
        .catch(function(e){ setError('Login error: ' + e.message); });
    }

    setInterval(function(){
      secondsLeft--;
      if(secondsLeft <= 0){
        secondsLeft = REFRESH_SECONDS;
        setStatus('Refreshing...');
        fetchData();
      } else {
        var s = $('status').textContent;
        if(s !== 'Connecting...' && s !== 'Refreshing...'){
          setStatus('Next update in ' + secondsLeft + 's');
        }
      }
    }, 1000);

    login();
  </script>
</body>
</html>
